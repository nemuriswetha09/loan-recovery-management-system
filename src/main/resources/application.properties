spring.application.name=loan-recovery-management-system
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loan_management_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=${SERVER_PORT:8080}
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_DEVELOPMENT_SECRET_KEY_TO_A_RANDOM_64_BYTE_VALUE}
app.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
app.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:2592000}
app.bootstrap.tenant-id=${BOOTSTRAP_TENANT_ID:0}
app.bootstrap.username=${BOOTSTRAP_USERNAME:}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=Loan Recovery Management System
info.app.version=1.0.0
